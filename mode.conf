# DOGE OI 运行模式开关 —— 只改下面这一行即可切换
#
#   MODE=actions   零成本: GitHub Actions 定时, 每 5 分钟判定一次
#   MODE=worker    实时:   云端 Worker / 本地常驻, 每 60 秒轮询
#
# 两套部署会同时读到这个文件并自动互斥: 只有当前模式对应的那一套
# 会真正发 Telegram, 另一套照常判定和打印日志但不推送。
# 所以无论两套是否都在跑, 都不会重复提醒。
#
# 生效方式:
#   GitHub Actions -> 改完提交, 下一次 job 立即生效
#   Worker(Docker) -> 改完提交, 在 Railway/Render 点一次 Redeploy
#
MODE=actions
