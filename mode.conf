# DOGE OI 运行模式开关 —— 只改下面这一行即可切换
#
#   MODE=actions   零成本: GitHub Actions 定时, 每 5 分钟判定一次
#   MODE=worker    实时:   云端 Worker / 本地常驻, 每 60 秒轮询
#
# 两套部署会同时读到这个文件并自动互斥: 只有当前模式对应的那一套
# 会真正发 Telegram, 另一套照常判定和打印日志但不推送。
# 所以无论两套是否都在跑, 都不会重复提醒。
#
# 生效方式:
#   GitHub Actions -> 改完提交, 下一次 job 立即生效
#   Worker(Docker) -> 改完提交, 在部署平台点一次 Redeploy
#
# 2026-11-12 23:30: 切回 actions(零成本, 今晚即可跑)。
# 之前停掉定时是因为 GitHub 托管 runner 在美国, dapi.binance.com 返回 451。
# 现在主脚本支持「币安优先 + OKX 币本位自动降级」: 币安 451 时自动用
# OKX 的 DOGE-USD-SWAP(同为币本位永续), 报告会标注当前数据源;
# 以后若把 Worker 部署到非美机房, 无需改代码即会自动切回币安官方口径。
# 设 DOGE_DISABLE_FALLBACK=1 可强制只用币安。
#
# 若以后改回 MODE=worker, 记得把 .github/workflows/doge-oi.yml 的 schedule
# 两行重新注释掉, 避免美国 runner 每 5 分钟空跑。
MODE=actions
