# DOGE OI 运行模式开关 —— 只改下面这一行即可切换
#
#   MODE=actions   零成本: GitHub Actions 定时, 每 5 分钟判定一次
#   MODE=worker    实时:   云端 Worker / 本地常驻, 每 60 秒轮询
#
# 两套部署会同时读到这个文件并自动互斥: 只有当前模式对应的那一套
# 会真正发 Telegram, 另一套照常判定和打印日志但不推送。
# 所以无论两套是否都在跑, 都不会重复提醒。
#
# 生效方式:
#   GitHub Actions -> 改完提交, 下一次 job 立即生效
#   Worker(Docker) -> 改完提交, 在 Railway 点一次 Redeploy
#
# 2026-11-12: 已切到 Worker。原因: GitHub Actions 托管 runner 在美国,
# dapi.binance.com 对美国 IP 返回 451(地域封锁), 拉不到币本位合约行情。
# Worker 需部署在境外非美机房(Oracle Cloud Frankfurt / Montreal / 东京等),
# 本机或美国区 IP 都不行。
# 若以后要切回 Actions, 把下面改回 actions, 并取消 .github/workflows/doge-oi.yml
# 里 schedule 那两行的注释。
MODE=worker
