# DOGE 币本位 OI 监控 — GitHub Actions 定时版(已暂停定时, 保留手动触发)
# 2026-11-12: 主监控已迁到境外非美机房的常驻 Worker(MODE=worker)。
# GitHub 托管 runner 在美国, dapi.binance.com 对美国 IP 返回 451,
# 每 5 分钟定时跑只会白跑, 故注释掉 schedule, 避免刷无意义的运行记录。
# 切回 Actions 时: 取消下面 schedule 两行注释 + mode.conf 改回 MODE=actions
name: 狗狗币持仓监控

on:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:            # 保留手动触发, 便于临时验证

# 避免同一时刻排队产生多个实例(状态文件提交回仓库时尤其需要)
concurrency:
  group: doge-oi-monitor
  cancel-in-progress: true

permissions:
  contents: write              # 允许把推送状态文件提交回仓库

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TZ: Asia/Shanghai
      DOGE_TG_TOKEN: ${{ secrets.DOGE_TG_TOKEN }}
      DOGE_TG_CHAT_ID: ${{ secrets.DOGE_TG_CHAT_ID }}
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 临时诊断: 在美国 runner 上实测哪些行情源能绕开 451 / 是否存在币本位 DOGE
      - name: 探测可用行情源
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          probes = [
            ("binance dapi", "https://dapi.binance.com/dapi/v1/ticker/price?symbol=DOGEUSD_PERP"),
            ("binance vision dapi", "https://data-api.binance.vision/dapi/v1/ticker/price?symbol=DOGEUSD_PERP"),
            ("binance gcp dapi", "https://api-gcp.binance.com/dapi/v1/ticker/price?symbol=DOGEUSD_PERP"),
            ("binance data dapi", "https://data.binance.com/dapi/v1/ticker/price?symbol=DOGEUSD_PERP"),
            ("binance api1 dapi", "https://api1.binance.com/dapi/v1/ticker/price?symbol=DOGEUSD_PERP"),
            ("binance api dapi", "https://api.binance.com/dapi/v1/ticker/price?symbol=DOGEUSD_PERP"),
            ("binance fapi", "https://fapi.binance.com/fapi/v1/ticker/price?symbol=DOGEUSDT"),
            ("binance vision spot", "https://data-api.binance.vision/api/v3/ticker/price?symbol=DOGEUSDT"),
            ("gate btc-settled list", "https://api.gateio.ws/api/v4/futures/btc/contracts"),
            ("gate usdt DOGE", "https://api.gateio.ws/api/v4/futures/usdt/contracts/DOGE_USDT"),
            ("okx swap list", "https://www.okx.com/api/v5/public/instruments?instType=SWAP"),
            ("bybit inverse DOGEUSD", "https://api.bybit.com/v5/market/tickers?category=inverse&symbol=DOGEUSD"),
          ]
          for name, url in probes:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=7) as r:
                      raw = r.read().decode("utf-8", "replace")
                      code = r.status
                  hits = re.findall(r'"[^"]{0,40}DOGE[^"]{0,40}"', raw, re.I)[:4]
                  extra = ("  | DOGE: " + ", ".join(hits)) if hits else ""
                  print("OK   %-24s HTTP %s  %s%s" % (name, code, raw[:90].replace("\n", " "), extra), flush=True)
              except urllib.error.HTTPError as e:
                  print("FAIL %-24s HTTP %s" % (name, e.code), flush=True)
              except Exception as e:
                  print("FAIL %-24s %s" % (name, type(e).__name__), flush=True)
          PY

      # 手动点 "Run workflow" 时, 先自检并往 Telegram 发一条测试消息,
      # 手机收到「✅ DOGE OI 提醒配置成功」即代表整条链路已接通
      - name: 手动触发时验证链路
        if: github.event_name == 'workflow_dispatch'
        run: python3 doge_oi_alert_v2.py --check

      - name: 跑一次判定
        run: python3 doge_oi_alert_v2.py --once

      # 状态直接存仓库, 比 actions/cache 可靠: 缓存条目不可变、7 天淘汰、
      # 且带 run_id 时每天会产生 ~288 个条目、并发取消还可能恢复旧状态。
      # 脚本只在 push_key 变化时才写文件, 所以这里仅信号变化才产生一次提交。
      - name: 保存推送状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .doge_oi_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "状态无变化, 不提交"
          else
            git commit -m "chore: 更新 OI 推送状态 [skip ci]"
            git push || { git pull --rebase origin HEAD && git push; }
          fi
